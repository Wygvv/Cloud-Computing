<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Firebase</title>

    <!-- Estilos principales -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Registro Firebase</h1>

        <p>
            Ingresa un producto para guardarlo en Firestore.
        </p>

        <input
            type="text"
            id="idProducto"
            placeholder="ID del producto"
        >

        <input
            type="text"
            id="nombreProducto"
            placeholder="Nombre del producto"
        >

        <input
            type="number"
            id="precioProducto"
            placeholder="Precio"
        >

        <input
            type="number"
            id="stockProducto"
            placeholder="Stock"
        >

        <button id="btnGuardarFirebase">
            Guardar en Firebase
        </button>

        <!-- NAVEGACIÓN -->

<a href="../index.html">

</a>

    </div>

    <!-- IMPORTANTE:
         type="module" permite usar import/export -->

        type="module"
        src="../js/productosFirebase.js">
    </script>

</body>

</html>
